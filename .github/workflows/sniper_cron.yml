name: Dual-Key Sniper Session Runner

on:
  schedule:
    # Separate cron entries with +2 minute offset to bypass GitHub top-of-the-hour queue drops
    - cron: '2 0 * * 1-5'   # 08:02 GMT+8 (Asian Session Open)
    - cron: '2 8 * * 1-5'   # 16:02 GMT+8 (London Session Open)
    - cron: '2 12 * * 1-5'  # 20:02 GMT+8 (London / NY Overlap Prime)
    - cron: '2 16 * * 1-5'  # 00:02 GMT+8 (Late US Session)
  workflow_dispatch: # Allows manual 1-click test run on GitHub anytime!

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to auto-commit and push updated parquet

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sniper Forecasting Engine & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sniper_bot.py

      - name: Persist Updated 15m Parquet Data Lake
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data_15m.parquet
          git diff-index --quiet HEAD || git commit -m "chore: auto-update parquet data lake [skip ci]"
          git push
