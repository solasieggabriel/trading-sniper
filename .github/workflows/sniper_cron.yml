name: Dual-Key Sniper Session Runner

on:
  schedule:
    # 08:00 GMT+8 -> 00:00 UTC
    # 16:00 GMT+8 -> 08:00 UTC
    # 20:00 GMT+8 -> 12:00 UTC
    # 00:00 GMT+8 -> 16:00 UTC
    # Runs Monday through Friday
    - cron: '0 0,8,12,16 * * 1-5'
  workflow_dispatch: # Allows manual 1-click test run on GitHub anytime!

jobs:
  run-sniper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sniper Forecasting Engine & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sniper_bot.py
